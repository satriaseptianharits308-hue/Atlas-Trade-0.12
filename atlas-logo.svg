<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="atlasGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="atlasGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded hexagon/shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0A0F1D" stroke="url(#glowRing)" stroke-width="2"/>

  <!-- Candlestick chart grid subtle accents -->
  <line x1="30" y1="90" x2="30" y2="30" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="60" y1="90" x2="60" y2="30" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="90" y1="90" x2="90" y2="30" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Stylized Geometric "A" / Delta Ascending Apex -->
  <!-- Left wing -->
  <path d="M60 22 L26 84 L38 84 L60 42 L82 84 L94 84 Z" fill="url(#atlasGrad1)" filter="url(#neonGlow)"/>

  <!-- Cross bar as an ascending green trading candlestick / breakout vector -->
  <path d="M42 66 L78 66 L74 58 L46 58 Z" fill="url(#atlasGrad2)"/>

  <!-- Ascending bull trend beacon pip -->
  <circle cx="60" cy="22" r="4.5" fill="#00F0FF" filter="url(#neonGlow)"/>
  <circle cx="60" cy="22" r="2" fill="#FFFFFF"/>
</svg>
